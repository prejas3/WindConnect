[package]
name = "windconnect-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WindConnect Windows client"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
wind-core = { path = "../../../crates/wind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
qrcode = { version = "=0.14.1", default-features = false }
if-addrs = "0.15"
# Wipes the QR modules of a closed pairing window (WN-94); already in the tree via wind-core.
zeroize = "1"
# PNG for clipboard images (WN-36); already in the tree via Tauri (0.18.1, MIT OR Apache-2.0).
png = "0.18"
# Clipboard history dedupe (WN-37); already in the tree via wind-core.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
# Battery alerts as Windows toasts with a click callback (WN-49); what tauri-plugin-notification uses on Windows (MIT OR Apache-2.0).
tauri-winrt-notification = "=0.7.3"
# The PC's player for the phone (WN-47): SMTC and thumbnail re-encoding; the same 0.61 tauri-winrt-notification already brings.
# WN-43: UI_Notifications + Data_Xml_Dom for the phone's toasts (tag/group/header), already built through tauri-winrt-notification.
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Storage_Streams", "Graphics_Imaging", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_StationsAndDesktops", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Shutdown", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
# examples/smtc_player.rs (WN-47 test player): publishing an SMTC session; same windows 0.61 as the app.
windows = { version = "0.61", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams", "Win32_UI_Shell", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
