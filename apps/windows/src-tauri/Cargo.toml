[package]
name = "windconnect-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WindConnect Windows client"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
wind-core = { path = "../../../crates/wind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
qrcode = { version = "=0.14.1", default-features = false }
if-addrs = "0.15"
# Wipes the QR modules of a closed pairing window (WN-94); already in the tree via wind-core.
zeroize = "1"
# PNG for clipboard images (WN-36); already in the tree via Tauri (0.18.1, MIT OR Apache-2.0).
png = "0.18"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_StationsAndDesktops", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Shutdown", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
