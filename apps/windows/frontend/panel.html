<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>WindConnect — panel</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="panel.css"><script type="module" src="panel.js"></script></head>
<body>
  <main class="panel" aria-label="Panel WindConnect">
    <header class="panel-heading"><div><h1><span class="state-dot" aria-hidden="true"></span>Twój telefon</h1><p id="connection-state" role="status">Brak połączenia</p></div><button class="button quiet small" id="dismiss" aria-label="Zamknij panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="quick-actions" aria-label="Szybkie akcje">
      <button disabled aria-describedby="pairing-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 16v5h14v-5"/></svg>Wyślij</button>
      <button disabled aria-describedby="pairing-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="12" height="16" rx="2"/><rect x="9" y="2" width="6" height="5" rx="1"/><path d="M9 12h6m-6 4h6"/></svg>Schowek</button>
      <button disabled aria-describedby="pairing-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zm5 4h4"/></svg>Dzwoń</button>
      <button disabled aria-describedby="pairing-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m8 9 3 3 5-5M5 16h14m-7 0v5"/></svg>Touchpad</button>
    </div>
    <section class="panel-empty" aria-labelledby="pairing-title"><span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M11 19h2"/></svg></span><h2 id="pairing-title">Miejsce na Twój telefon</h2><p id="pairing-hint">Po sparowaniu urządzenia znajdziesz tu zdjęcia, powiadomienia i szybkie akcje.</p><p class="subtle">Parowanie pojawi się w kolejnym etapie.</p></section>
    <footer><button id="settings" class="button quiet small">Otwórz aplikację</button><span id="shortcut" class="subtle">Win + Shift + W</span></footer>
    <p id="shortcut-error" class="subtle" role="status" hidden>Win + Shift + W jest zajęty. Otwórz panel ikoną w zasobniku.</p>
    <p id="panel-error" role="alert" hidden>Nie udało się wykonać akcji.</p>
  </main>
</body></html>
