<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title data-i18n="sms.windconnect_wiadomosci"></title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sms.css"><script type="module" src="sms.js"></script></head>
<body>
  <div class="sms">
    <aside class="threads" data-i18n-aria-label="sms.threads">
      <header class="threads-head">
        <h1 data-i18n="sms.messages"></h1>
        <button id="new-message" class="button quiet small" data-i18n-aria-label="sms.new-message_label" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="refresh" class="button quiet small" data-i18n-aria-label="sms.refresh_label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
      </header>
      <input id="search" class="search" type="search" data-i18n-placeholder="sms.search_placeholder" data-i18n-aria-label="sms.search_label" autocomplete="off">
      <p id="threads-status" class="subtle threads-status" role="status"></p>
      <ul id="thread-list" class="thread-list" role="listbox" data-i18n-aria-label="sms.thread-list_label"></ul>
    </aside>
    <section class="conversation" aria-labelledby="conversation-title">
      <div class="new-to" id="new-to" hidden><label for="to" data-i18n="sms.do"></label><input id="to" class="search" type="text" inputmode="tel" data-i18n-placeholder="sms.to_placeholder" autocomplete="off"></div>
      <header class="conversation-head" id="conversation-head" hidden>
        <span class="avatar large" id="conversation-avatar" aria-hidden="true"></span>
        <div><h2 id="conversation-title"></h2><p id="conversation-sub" class="subtle"></p></div>
      </header>
      <div id="messages" class="messages" tabindex="0" data-i18n-aria-label="sms.messages_label" hidden>
        <button id="older" class="button quiet small older" hidden data-i18n="sms.older"></button>
        <ol id="message-list" class="message-list"></ol>
      </div>
      <div id="empty" class="empty-state">
        <span class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8m-8 3h5"/></svg></span>
        <h2 id="empty-title" data-i18n="sms.empty-title"></h2>
        <p id="empty-text" data-i18n="sms.empty-text"></p>
      </div>
      <p id="conversation-status" class="subtle conversation-status" role="status"></p>
      <form id="composer" class="composer" hidden>
        <div id="attachment" class="attachment-preview" hidden><img id="attachment-image" data-i18n-alt="sms.attachment-image_alt"><button type="button" id="attachment-remove" class="button quiet small" data-i18n-aria-label="sms.attachment-remove_label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="composer-row">
          <button type="button" id="attach" class="button quiet small" data-i18n-aria-label="sms.attach_label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 16 5-5 4 4 3-3 4 4"/><circle cx="15" cy="9" r="1.5"/></svg></button>
          <input id="attach-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <textarea id="body" rows="1" data-i18n-placeholder="sms.body_placeholder" data-i18n-aria-label="sms.body_label"></textarea>
          <select id="sim" class="sim" data-i18n-aria-label="sms.sim_label" hidden></select>
          <button id="send" class="button primary small" type="submit" data-i18n="sms.send"></button>
        </div>
        <p id="composer-note" class="subtle composer-note"></p>
      </form>
    </section>
  </div>
</body></html>
