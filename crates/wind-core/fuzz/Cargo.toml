[package]
name = "wind-core-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wind-core = { path = ".." }

# Not part of the main workspace: it needs nightly and libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "frame_reader"
path = "fuzz_targets/frame_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram"
path = "fuzz_targets/datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor"
path = "fuzz_targets/cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pair_message"
path = "fuzz_targets/pair_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pair_uri"
path = "fuzz_targets/pair_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paired_file"
path = "fuzz_targets/paired_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "actions"
path = "fuzz_targets/actions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "features"
path = "fuzz_targets/features.rs"
