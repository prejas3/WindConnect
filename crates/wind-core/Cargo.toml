[package]
name = "wind-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared core for WindConnect"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "zeroize"] }
mdns-sd = "0.21.7"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Already in the tree through rustls and quinn: HMAC with constant-time
# verification for pairing (PROTOCOL.md §12).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
zeroize = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "rt-multi-thread", "sync"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

