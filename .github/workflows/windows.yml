name: Windows MSI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test Windows client
        run: cargo +stable test --locked -p windconnect-windows
      - name: Lint Windows client
        run: cargo +stable clippy --locked -p windconnect-windows --all-targets -- -D warnings
      - name: Test Windows controls
        shell: pwsh
        run: |
          $uiTools = Join-Path $env:RUNNER_TEMP 'windconnect-ui-tools'
          npm install --prefix $uiTools --no-audit --no-fund playwright@1.61.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $uiTools 'node_modules/.bin/playwright.cmd') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_MODULE = Join-Path $uiTools 'node_modules/playwright'
          node apps/windows/scripts/check-ui.cjs
          exit $LASTEXITCODE
      - name: Install Tauri CLI
        run: cargo +stable install tauri-cli --version 2.11.4 --locked
      - name: Build MSI
        working-directory: apps/windows
        run: cargo +stable tauri build --bundles msi -- --locked
      - name: Check firewall rule in MSI
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi | ForEach-Object {
            & ./apps/windows/scripts/check-firewall-msi.ps1 -MsiPath $_.FullName
          }
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: WindConnect-windows-x64-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
