name: Android debug APK

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Set up Rust for Android
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Lint Android app
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # WN-124 (decision D2): the full build keeps SMS, Call Log and contacts; the Play build has none of them.
      - name: Store permissions (GitHub and Play builds)
        run: |
          node ../../scripts/check-android-store-permissions.cjs app/build/outputs/apk/debug/app-debug.apk github
          ./gradlew --no-daemon :app:assembleDebug -PwindStore=play
          node ../../scripts/check-android-store-permissions.cjs app/build-play/outputs/apk/debug/app-play-debug.apk play
      - name: Core unit tests (JVM)
        run: ./gradlew --no-daemon :wind-core:testDebugUnitTest
      - name: Build reusable core AAR
        run: ./gradlew --no-daemon :wind-core:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WindConnect-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload core AAR
        uses: actions/upload-artifact@v4
        with:
          name: WindConnect-wind-core-aar
          path: apps/android/wind-core/build/outputs/aar/wind-core-release.aar
          if-no-files-found: error
