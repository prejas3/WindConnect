name: Core CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    name: wind-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # WN-114: one version in every manifest, and a v* tag on HEAD matches it.
      - name: Check versions and tags
        run: node scripts/check-version.cjs
      # WN-167: tokens.css and Android's BrandColors.kt are generated from assets/brand-tokens.json.
      - name: Check brand tokens
        run: node scripts/generate-brand-tokens.cjs --check
      # WN-163: the Rust pinned in rust-toolchain.toml (with rustfmt and clippy), the same as local builds.
      - name: Install pinned Rust
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core and UniFFI
        run: cargo test --locked -p wind-core -p wind-ffi -p windctl --all-features
      # The latency budgets measured under a saturating transfer (WC-11,
      # WC-13) run alone, one test at a time, so that only the code is
      # measured, not other tests loading the machine (WN-85).
      # WN-163 (decision A): on shared runners they are informational. The
      # numbers go to the run summary, over budget is a warning, never a red
      # build; the gate is the same run on real hardware (tests/latency.rs).
      - name: Latency budgets under load (informational)
        shell: bash
        run: |
          set -o pipefail
          if cargo test --locked -p wind-core --test latency -- --ignored --test-threads=1 --nocapture 2>&1 | tee latency.log; then
            verdict="within budget on this runner"
          else
            verdict="over budget on this shared runner (informational; the gate is real hardware)"
            echo "::warning title=Latency budgets under load::${verdict}. See the run summary and crates/wind-core/tests/latency.rs."
          fi
          {
            echo "### Latency budgets under load (${{ matrix.os }}): ${verdict}"
            echo '```'
            grep -oE 'round [0-9]+: .*' latency.log || echo "no measurements (see the step's log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint core and UniFFI
        run: cargo clippy --locked -p wind-core -p wind-ffi -p windctl --all-targets --all-features -- -D warnings
      - name: Build core and UniFFI
        run: cargo build --locked -p wind-core -p wind-ffi -p windctl --all-targets --all-features
